name: napari-mlarray
display_name: Mlarray
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: napari-mlarray.get_reader
      python_name: napari_mlarray._reader:napari_get_reader
      title: Open data with Mlarray
    - id: napari-mlarray.write_multiple
      python_name: napari_mlarray._writer:write_multiple
      title: Save multi-layer data with Mlarray
    - id: napari-mlarray.write_single_image
      python_name: napari_mlarray._writer:write_single_image
      title: Save image data with Mlarray
    - id: napari-mlarray.make_container_widget
      python_name: napari_mlarray:ImageThreshold
      title: Make threshold Container widget
    - id: napari-mlarray.make_magic_widget
      python_name: napari_mlarray:threshold_magic_widget
      title: Make threshold magic widget
    - id: napari-mlarray.make_function_widget
      python_name: napari_mlarray:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: napari-mlarray.make_qwidget
      python_name: napari_mlarray:ExampleQWidget
      title: Make example QWidget
  readers:
    - command: napari-mlarray.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: napari-mlarray.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-mlarray.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  widgets:
    - command: napari-mlarray.make_container_widget
      display_name: Container Threshold
    - command: napari-mlarray.make_magic_widget
      display_name: Magic Threshold
    - command: napari-mlarray.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: napari-mlarray.make_qwidget
      display_name: Example QWidget
  menus:
    napari/layers/segment:
      - command: napari-mlarray.make_container_widget
      - command: napari-mlarray.make_magic_widget
      - command: napari-mlarray.make_function_widget
      - command: napari-mlarray.make_qwidget
